name: asv-webp-character-marker-accounting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asv-webp-character-marker-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bible OS package
        run: pip install .
      - name: Reproduce compact text-private ASV and WEBP character marker profile
        run: >-
          python -m scripts.asv_webp_character_marker_profile_ci
          --expected registry/experiments/asv-webp-character-marker-accounting.json
          --report asv-webp-character-marker-accounting-report.json
      - name: Display metadata-only character marker evidence
        if: always()
        run: cat asv-webp-character-marker-accounting-report.json
