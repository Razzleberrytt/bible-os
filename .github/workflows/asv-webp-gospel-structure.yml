name: asv-webp-gospel-structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asv-webp-gospel-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bible OS package
        run: pip install .
      - name: Reproduce compact text-private ASV and WEBP Gospel structure profile
        run: >-
          python -m scripts.asv_webp_gospel_structure_profile_ci
          --expected registry/experiments/asv-webp-gospel-structure.json
          --report asv-webp-gospel-structure-report.json
      - name: Display metadata-only Gospel structure evidence
        if: always()
        run: cat asv-webp-gospel-structure-report.json
