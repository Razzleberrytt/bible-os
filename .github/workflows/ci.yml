name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install '.[dev]'
      - run: bash scripts/verify.sh

  versification-registry-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bible OS package
        run: pip install .
      - name: Audit versification governance registry
        run: >-
          python -m scripts.versification_registry_integrity
          --root .
          --report versification-registry-integrity-report.json
      - name: Display versification registry integrity evidence
        if: always()
        run: cat versification-registry-integrity-report.json

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bible_os
          POSTGRES_PASSWORD: bible_os_ci
          POSTGRES_DB: bible_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bible_os -d bible_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: bible_os_ci
      DATABASE_URL: postgresql://bible_os:bible_os_ci@localhost:5432/bible_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Apply database migrations
        run: |
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0001_foundation.up.sql
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0002_reference_relation.up.sql
      - name: Load synthetic 100-reference fixture
        run: python scripts/bsb_fixture.py load
      - name: Validate fixture and append-only controls
        run: python scripts/bsb_fixture.py validate

  split-join-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bible_os
          POSTGRES_PASSWORD: bible_os_ci
          POSTGRES_DB: bible_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bible_os -d bible_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: bible_os_ci
      DATABASE_URL: postgresql://bible_os:bible_os_ci@localhost:5432/bible_os
      BIBLE_OS_ENABLE_SYNTHETIC_MATERIALIZERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and database driver
        run: pip install '.[dev]'
      - name: Apply database migrations
        run: |
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0001_foundation.up.sql
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0002_reference_relation.up.sql
      - name: Materialize and validate synthetic split and join fixtures
        run: >-
          python -m scripts.synthetic_split_join_ci
          --report synthetic-split-join-report.json
      - name: Display locator-only split and join evidence
        run: cat synthetic-split-join-report.json

  asv-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official ASV 1901 USFM archive
        run: >-
          python scripts/probe_acquisition.py
          registry/acquisitions/eng-asv-usfm.json
          --report asv-acquisition-report.json
      - name: Display ASV acquisition evidence
        if: always()
        run: cat asv-acquisition-report.json

  asv-structure-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bible OS package
        run: pip install .
      - name: Verify ASV structure and compare locators with WEBP
        run: >-
          python -m scripts.asv_adapter_smoke
          registry/acquisitions/eng-asv-usfm.json
          --webp-target registry/acquisitions/engwebp-usfm.json
          --baseline registry/versification/bsb-chapter-verse-counts.json
          --expected registry/import-profiles/eng-asv-usfm-smoke.json
          --report asv-adapter-report.json
      - name: Display locator-only ASV structure evidence
        if: always()
        run: cat asv-adapter-report.json

  webp-acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer package
        run: pip install .
      - name: Probe official WEBP USFM archive
        run: >-
          python scripts/probe_acquisition.py
          registry/acquisitions/engwebp-usfm.json
          --report acquisition-report.json
      - name: Run WEBP adapter smoke test
        run: >-
          python -m scripts.webp_adapter_smoke
          registry/acquisitions/engwebp-usfm.json
          --baseline registry/versification/bsb-chapter-verse-counts.json
          --expected registry/import-profiles/engwebp-usfm-smoke.json
          --report webp-adapter-report.json
      - name: Display acquisition evidence
        run: cat acquisition-report.json
      - name: Display adapter evidence
        run: cat webp-adapter-report.json

  webp-database-load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bible_os
          POSTGRES_PASSWORD: bible_os_ci
          POSTGRES_DB: bible_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bible_os -d bible_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: bible_os_ci
      DATABASE_URL: postgresql://bible_os:bible_os_ci@localhost:5432/bible_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install importer and database driver
        run: pip install '.[dev]'
      - name: Apply database migrations
        run: |
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0001_foundation.up.sql
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0002_reference_relation.up.sql
      - name: Fingerprint, load, and validate WEBP without retention
        run: >-
          python -m scripts.webp_full_ci
          --expected-export registry/import-profiles/engwebp-normalized-export.json
          --report webp-full-ci-report.json
      - name: Materialize and validate the registered reference observation
        run: >-
          python -m scripts.reference_observation_materializer
          --report reference-observation-report.json
      - name: Materialize and validate explicit reference relations
        run: >-
          python -m scripts.reference_relation_backfill
          --report reference-relation-report.json
      - name: Display no-retention reproducibility evidence
        run: cat webp-full-ci-report.json
      - name: Display reference observation evidence
        run: cat reference-observation-report.json
      - name: Display reference relation evidence
        run: cat reference-relation-report.json
