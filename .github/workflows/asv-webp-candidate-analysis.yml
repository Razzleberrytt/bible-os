name: asv-webp-candidate-analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asv-webp-candidate-analysis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bible_os
          POSTGRES_PASSWORD: bible_os_ci
          POSTGRES_DB: bible_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bible_os -d bible_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: bible_os_ci
      DATABASE_URL: postgresql://bible_os:bible_os_ci@localhost:5432/bible_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and database driver
        run: pip install '.[dev]'
      - name: Apply database migrations
        run: |
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0001_foundation.up.sql
          psql -h localhost -U bible_os -d bible_os -v ON_ERROR_STOP=1 -f database/migrations/0002_reference_relation.up.sql
      - name: Reproduce inert ASV and WEBP locator candidates
        run: >-
          python -m scripts.asv_webp_candidate_ci
          --expected registry/experiments/asv-webp-locator-candidates.json
          --report asv-webp-candidate-report.json
      - name: Display metadata-only candidate evidence
        if: always()
        run: cat asv-webp-candidate-report.json
