name: webp-upstream-revision-impact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-normalized-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install '.[dev]'
      - name: Test revision-impact comparison logic
        run: python -m pytest -q tests/test_webp_upstream_revision_impact.py
      - name: Compare quarantined revision to frozen normalized export
        run: python -m scripts.webp_upstream_revision_impact --report webp-upstream-revision-impact.json
      - name: Compare normalized lexical projection to frozen profile
        run: >-
          python -m scripts.webp_upstream_revision_lexical_projection
          --report webp-upstream-revision-lexical-projection.json
