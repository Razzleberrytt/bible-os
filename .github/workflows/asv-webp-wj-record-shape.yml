name: asv-webp-wj-record-shape

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  asv-webp-wj-record-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Bible OS package
        run: pip install .
      - name: Reproduce compact text-private ASV and WEBP wj record shape
        run: >-
          python -m scripts.asv_webp_wj_record_shape_profile_ci
          --expected registry/experiments/asv-webp-wj-record-shape.json
          --report asv-webp-wj-record-shape-report.json
      - name: Display metadata-only wj record-shape evidence
        if: always()
        run: cat asv-webp-wj-record-shape-report.json
